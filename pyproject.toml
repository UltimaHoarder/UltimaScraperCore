[project]
name = "ultima-scraper-core"
version = "0.1.0"
description = "Shared dependency-light contracts and primitives for UltimaScraper services."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
authors = [
    { name = "UltimaHoarder", email = "21285176+UltimaHoarder@users.noreply.github.com" },
]
dependencies = [
    "platformdirs>=4.3,<5",
]

[project.urls]
Homepage = "https://github.com/UltimaHoarder/UltimaScraperCore"
Repository = "https://github.com/UltimaHoarder/UltimaScraperCore"
Issues = "https://github.com/UltimaHoarder/UltimaScraperCore/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ultima_scraper_core"]
